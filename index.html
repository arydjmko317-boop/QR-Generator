<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Pro - Modern & Powerful QR Generator</title>
    <meta name="description" content="Hasilkan kode QR berkualitas tinggi dengan kustomisasi warna, logo, dan gaya secara instan.">
    <meta name="keywords" content="qr generator, buat qr code, qr modern, qr kustom">
    
    <!-- Social Meta Tags -->
    <meta property="og:title" content="QR Pro - Modern QR Generator">
    <meta property="og:description" content="Generate QR codes with style and precision.">
    <meta name="twitter:title" content="QR Pro - Modern QR Generator">
    <meta name="twitter:description" content="Generate QR codes with style and precision.">

    <script src="https://resource.trickle.so/vendor_lib/unpkg/react@18/umd/react.production.min.js"></script>
    <script src="https://resource.trickle.so/vendor_lib/unpkg/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://resource.trickle.so/vendor_lib/unpkg/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://resource.trickle.so/vendor_lib/unpkg/lucide-static@0.516.0/font/lucide.css" rel="stylesheet">
    
    <!-- QR Code Library -->
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>

    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --secondary: #6b7280;
            --background: #f8fafc;
            --page-bg: #f8fafc;
            --surface: #ffffff;
            --panel: #ffffff;
            --header-bg: rgba(255,255,255,0.96);
            --frame: #f1f5f9;
            --line: #e2e8f0;
            --accent: #eff6ff;
            --radius: 24px;
        }

        body {
            background:
                radial-gradient(circle at top left, rgba(96, 165, 250, 0.22), transparent 28%),
                radial-gradient(circle at bottom right, rgba(59, 130, 246, 0.18), transparent 30%),
                linear-gradient(135deg, #f8fbff 0%, #eef6ff 35%, #f4f9ff 100%);
            color: #1f2937;
            font-family: Arial, Helvetica, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            min-height: 100vh;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background-image: radial-gradient(circle, rgba(59, 130, 246, 0.18) 1.4px, transparent 1.8px);
            background-size: 18px 18px;
            background-position: center;
            opacity: 0.7;
            mask-image: radial-gradient(circle at center, black 35%, transparent 100%);
        }

        body ::selection {
            background: #dbeafe;
        }

        h1, h2, h3, h4 {
            font-weight: 700;
            letter-spacing: -0.04em;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            border-radius: 9999px;
            padding: 0.75rem 1.25rem;
            font-size: 10px;
            font-weight: 900;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-dark);
        }

        .btn-secondary {
            border: 1px solid var(--primary);
            background: white;
            color: var(--primary);
        }

        .btn-secondary:hover {
            background: var(--primary);
            color: white;
        }

        .card {
            border-radius: 28px;
            border: 1px solid var(--line);
            background: var(--panel);
            box-shadow: 0 8px 24px rgba(15, 23, 42, 0.04);
        }

        .input-field {
            width: 100%;
            border-radius: 16px;
            border: 1px solid var(--line);
            background: white;
            padding: 0.75rem 1rem;
            font-size: 0.875rem;
            color: #334155;
            outline: none;
            transition: all 0.2s ease;
        }

        .input-field:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 2px #dbeafe;
        }

        .tab-btn {
            flex: 1;
            border-bottom: 2px solid transparent;
            padding: 1rem 1.25rem;
            font-size: 10px;
            font-weight: 900;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            transition: all 0.3s ease;
        }

        .section-label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 10px;
            font-weight: 900;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            color: var(--primary);
        }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel" src="components/Header.js"></script>
    <script type="text/babel" src="components/QRDisplay.js"></script>
    <script type="text/babel" src="components/ControlPanel.js"></script>
    <script type="text/babel" src="utils/qrHelper.js"></script>
    <script type="text/babel" src="app.js"></script>
</body>
</html>

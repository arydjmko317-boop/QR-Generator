    <style type="text/tailwindcss">
    @layer theme {
        :root {
            --primary: #111827;
            --primary-dark: #000000;

            --surface: #ffffff;
            --accent: #f3f4f6;

    @layer base {
        body {
            @apply bg-[var(--background)] text-gray-900 font-sans antialiased selection:bg-gray-200;
        }
        h1, h2, h3, h4 {
            @apply font-bold tracking-tight uppercase;

        .btn-primary {
            @apply bg-black text-white hover:bg-white hover:text-black active:scale-95;
        }
        .btn-secondary {

        }
        .card {

        }
        .input-field {
